  <circle cx="12.65" cy="18" r="1.3" fill="#ff2b4a"/>
  <circle cx="17.5" cy="20.6" r=".9" fill="#ffd84a"/>
  <circle cx="20" cy="20.6" r=".9" fill="#22e1ff"/>
  <!-- coin door -->
  <rect x="13.5" y="24.5" width="5" height="3" rx=".5" fill="#4a4a55"/>
